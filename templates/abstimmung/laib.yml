# A Werkstatt app (laib-app new; guide: /opt/werkstatt/guide/apps.md).
name: abstimmung
title: Abstimmung
beschreibung: Mensch und Kanzler, eine Umfrage vom Bierdeckel
template: {registry: apps, name: abstimmung, version: 1}
provides: [abstimmung]
# A poll for invited guests from outside the household (mdopp/abstimmung):
# who was a good person, who a good chancellor. No accounts and no Authelia:
# the guests have no login on the box. The app is its own gate instead: only
# the invite link https://abstimmung.<domain>/?e=<word> lets a browser in,
# the word is the owner's key below. It talks to no other service.
routes:
  # abstimmung.<domain>: one Strato CNAME (ADR 0007), the owner creates it.
  # public and auth: none are the owner's decision (the Inbox card marks
  # both): guests open it from anywhere, and the app refuses everybody
  # without the invite word itself.
  - host: abstimmung
    port: 18216
    exposure: public
    auth: none
    loginProbe: /ergebnis            # the result page: 403 without the invite's cookie, as every page but /healthz; laib-app check measures the app's own gate there (#774)
secrets:
  - name: ABSTIMMUNG_EINLADUNG       # the invite word: the owner enters it on the box page, never generated (he passes it on in the link); optional so the service installs before he has chosen one: without it every page answers 403
    owner: {label: "Abstimmung: Einladungswort", warum: "Nur wer den Einladungslink mit diesem Wort öffnet, kann abstimmen und das Ergebnis sehen.", hilfe: "Denk dir ein Wort aus Buchstaben und Ziffern aus, ohne Leerzeichen, und trag es hier ein. Der Einladungslink für deine Gäste ist die Adresse der Abstimmung mit /?e= und diesem Wort dahinter, zum Beispiel https://abstimmung.example.de/?e=bierdeckel. Trägst du später ein neues Wort ein, gelten die alten Links nicht mehr."}
    external: true
    optional: true
data:
  - path: ${DATA_DIR}/abstimmung     # stimmen.json: the votes by cookie id, with the name a voter chose to give; plain JSON, backed up
health:
  http: http://127.0.0.1:18216/healthz
ports:
  # only Caddy reaches it, never the WLAN
  - {port: 18216, lan: false}
